<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PolyEdge Dashboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface2: #1a1a26;
    --border: #2a2a3a;
    --green: #00ff88;
    --green-dim: #00ff8844;
    --red: #ff4466;
    --red-dim: #ff446633;
    --yellow: #ffcc00;
    --yellow-dim: #ffcc0022;
    --blue: #4488ff;
    --text: #e8e8f0;
    --muted: #6666aa;
    --font-mono: 'Space Mono', monospace;
    --font-display: 'Syne', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    min-height: 100vh;
    padding: 24px;
  }

  .header {
    display: flex;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 32px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 20px;
  }

  .logo {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 28px;
    color: var(--green);
    letter-spacing: -1px;
  }

  .tagline {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .refresh-btn {
    margin-left: auto;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--green);
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 8px 16px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.2s;
  }
  .refresh-btn:hover { background: var(--green-dim); border-color: var(--green); }

  .grid-4 {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 24px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 20px;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
  }
  .card.green::before { background: var(--green); }
  .card.red::before { background: var(--red); }
  .card.yellow::before { background: var(--yellow); }
  .card.blue::before { background: var(--blue); }

  .card-label {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .card-value {
    font-family: var(--font-display);
    font-size: 32px;
    font-weight: 800;
    line-height: 1;
  }

  .card-value.green { color: var(--green); }
  .card-value.red { color: var(--red); }
  .card-value.yellow { color: var(--yellow); }
  .card-value.blue { color: var(--blue); }

  .card-sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 6px;
  }

  .section-title {
    font-family: var(--font-display);
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 12px;
    margin-top: 8px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }

  th {
    text-align: left;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
  }

  td {
    padding: 10px 12px;
    border-bottom: 1px solid #1a1a26;
    vertical-align: middle;
  }

  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--surface2); }

  .badge {
    display: inline-block;
    padding: 3px 8px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .badge-win { background: var(--green-dim); color: var(--green); }
  .badge-lose { background: var(--red-dim); color: var(--red); }
  .badge-pending { background: var(--yellow-dim); color: var(--yellow); }

  .pnl-pos { color: var(--green); font-weight: 700; }
  .pnl-neg { color: var(--red); font-weight: 700; }

  .edge-bar {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .edge-fill {
    height: 4px;
    background: var(--green);
    min-width: 4px;
    max-width: 100px;
  }

  .question-text {
    max-width: 280px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text);
  }

  .price-row { display: flex; align-items: center; gap: 8px; }
  .price-arrow { font-size: 10px; }
  .price-up { color: var(--red); }
  .price-down { color: var(--green); }

  .loading {
    text-align: center;
    padding: 60px;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 2px;
  }

  .error { color: var(--red); padding: 20px; font-size: 12px; }

  .city-tag {
    font-size: 10px;
    padding: 2px 6px;
    background: var(--surface2);
    color: var(--blue);
    border: 1px solid var(--border);
  }

  .scenario-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 8px;
  }

  .scenario {
    padding: 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
  }

  .scenario-label { font-size: 10px; color: var(--muted); letter-spacing: 1px; margin-bottom: 4px; }
  .scenario-value { font-size: 18px; font-family: var(--font-display); font-weight: 700; }

  .last-updated { font-size: 10px; color: var(--muted); margin-left: auto; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">PolyEdge</div>
  <div class="tagline">Weather Trading Bot</div>
  <div class="last-updated" id="lastUpdated">—</div>
  <button class="refresh-btn" onclick="loadData()">↻ REFRESH</button>
</div>

<div id="content"><div class="loading">LOADING DASHBOARD...</div></div>

<script>
const API = 'https://pmbot-production.up.railway.app';

async function loadData() {
  document.getElementById('content').innerHTML = '<div class="loading">FETCHING DATA...</div>';
  try {
    const data = await fetch(API + '/dashboard').then(r => r.json());
    if (data.status === 'error') throw new Error(data.message);
    render(data);
    document.getElementById('lastUpdated').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch(e) {
    document.getElementById('content').innerHTML = `<div class="error">Error: ${e.message}</div>`;
  }
}

function fmt(n) { return n >= 0 ? '+$' + n.toFixed(2) : '-$' + Math.abs(n).toFixed(2); }
function fmtPct(n) { return (n * 100).toFixed(1) + '%'; }
function shortQ(q) { return q ? q.replace('Will the highest temperature in ', '').replace(' be ', ' ') : '—'; }

function render(d) {
  const s = d.summary;
  const resolved = s.wins + s.losses;

  document.getElementById('content').innerHTML = `

    <!-- KPI CARDS -->
    <div class="grid-4">
      <div class="card ${s.total_pnl >= 0 ? 'green' : 'red'}">
        <div class="card-label">Total P&L</div>
        <div class="card-value ${s.total_pnl >= 0 ? 'green' : 'red'}">${fmt(s.total_pnl)}</div>
        <div class="card-sub">${s.total} clean trades</div>
      </div>
      <div class="card yellow">
        <div class="card-label">Win Rate</div>
        <div class="card-value yellow">${s.win_rate}%</div>
        <div class="card-sub">${s.wins}W / ${s.losses}L / ${s.pending}P</div>
      </div>
      <div class="card blue">
        <div class="card-label">Pending</div>
        <div class="card-value blue">$${s.pending_invested.toFixed(0)}</div>
        <div class="card-sub">${s.pending} active bets</div>
      </div>
      <div class="card green">
        <div class="card-label">If All Pending Win</div>
        <div class="card-value green">${fmt(s.potential_if_all_win)}</div>
        <div class="card-sub">Worst case: ${fmt(s.worst_case)}</div>
      </div>
    </div>

    <!-- PENDING BETS -->
    <div class="section-title">⏳ Active Bets</div>
    <div class="card" style="margin-bottom:24px">
      ${d.pending.length === 0 ? '<div style="color:var(--muted);padding:20px;font-size:12px">No pending bets</div>' : `
      <table>
        <thead>
          <tr>
            <th>City</th>
            <th>Market</th>
            <th>Target</th>
            <th>Entry</th>
            <th>Bet</th>
            <th>Edge</th>
            <th>Potential Win</th>
            <th>Days Out</th>
          </tr>
        </thead>
        <tbody>
          ${d.pending.map(t => `
            <tr>
              <td><span class="city-tag">${t.city}</span></td>
              <td><span class="question-text">${shortQ(t.question)}</span></td>
              <td>${t.target_date}</td>
              <td>${t.entry_price_c ? t.entry_price_c.toFixed(1) + '¢' : '—'}</td>
              <td>$${t.bet_size}</td>
              <td>
                <div class="edge-bar">
                  <div class="edge-fill" style="width:${Math.min((t.edge||0)*200,100)}px"></div>
                  <span style="color:var(--green)">${t.edge ? fmtPct(t.edge) : '—'}</span>
                </div>
              </td>
              <td class="pnl-pos">+$${(t.potential_profit||0).toFixed(2)}</td>
              <td style="color:var(--muted)">${t.days_out}d</td>
            </tr>
          `).join('')}
        </tbody>
      </table>`}
    </div>

    <!-- SCENARIOS -->
    <div class="grid-2" style="margin-bottom:24px">
      <div class="card green">
        <div class="card-label">Best Case (All Win)</div>
        <div class="scenario-grid">
          <div class="scenario">
            <div class="scenario-label">Total P&L</div>
            <div class="scenario-value pnl-pos">${fmt(s.potential_if_all_win)}</div>
          </div>
          <div class="scenario">
            <div class="scenario-label">Pending Payout</div>
            <div class="scenario-value pnl-pos">+$${d.pending.reduce((a,t) => a + (t.potential_profit||0), 0).toFixed(2)}</div>
          </div>
        </div>
      </div>
      <div class="card red">
        <div class="card-label">Worst Case (All Lose)</div>
        <div class="scenario-grid">
          <div class="scenario">
            <div class="scenario-label">Total P&L</div>
            <div class="scenario-value pnl-neg">${fmt(s.worst_case)}</div>
          </div>
          <div class="scenario">
            <div class="scenario-label">At Risk</div>
            <div class="scenario-value pnl-neg">-$${s.pending_invested.toFixed(2)}</div>
          </div>
        </div>
      </div>
    </div>

    <!-- PRICE MOVEMENT -->
    ${d.price_movement && d.price_movement.length > 0 ? `
    <div class="section-title">📈 Price Movement (Last 48h)</div>
    <div class="card" style="margin-bottom:24px">
      <table>
        <thead>
          <tr>
            <th>City</th>
            <th>Date</th>
            <th>Range</th>
            <th>Open</th>
            <th>Current</th>
            <th>Movement</th>
            <th>Min</th>
            <th>Max</th>
            <th>Scans</th>
          </tr>
        </thead>
        <tbody>
          ${d.price_movement.map(p => {
            const mv = p.current_price - p.open_price;
            const q = p.question ? p.question.replace('Will the highest temperature in ','').replace(/ on .*/,'') : '—';
            return `<tr>
              <td><span class="city-tag">${p.city}</span></td>
              <td>${p.target_date}</td>
              <td style="font-size:11px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${q}</td>
              <td>${p.open_price ? p.open_price.toFixed(1)+'¢' : '—'}</td>
              <td>${p.current_price ? p.current_price.toFixed(1)+'¢' : '—'}</td>
              <td class="${mv > 0 ? 'price-up' : mv < 0 ? 'pnl-pos' : ''}">${mv > 0 ? '▲' : mv < 0 ? '▼' : '—'} ${Math.abs(mv).toFixed(1)}¢</td>
              <td style="color:var(--green)">${p.min_price ? p.min_price.toFixed(1)+'¢' : '—'}</td>
              <td style="color:var(--red)">${p.max_price ? p.max_price.toFixed(1)+'¢' : '—'}</td>
              <td style="color:var(--muted)">${p.scans}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>` : ''}

    <!-- RECENT RESOLVED -->
    <div class="section-title">🏁 Recent Results</div>
    <div class="card" style="margin-bottom:24px">
      ${d.recent_resolved.length === 0 ? '<div style="color:var(--muted);padding:20px;font-size:12px">No resolved trades yet</div>' : `
      <table>
        <thead>
          <tr>
            <th>City</th>
            <th>Market</th>
            <th>Entry</th>
            <th>Bet</th>
            <th>Result</th>
            <th>P&L</th>
            <th>Actual Temp</th>
            <th>Resolved</th>
          </tr>
        </thead>
        <tbody>
          ${d.recent_resolved.map(t => `
            <tr>
              <td><span class="city-tag">${t.city}</span></td>
              <td><span class="question-text">${shortQ(t.question)}</span></td>
              <td>${t.entry_price_c ? t.entry_price_c.toFixed(1) + '¢' : '—'}</td>
              <td>$${t.bet_size}</td>
              <td><span class="badge badge-${t.outcome === 'Yes' ? 'win' : 'lose'}">${t.outcome === 'Yes' ? '✓ WIN' : '✗ LOSS'}</span></td>
              <td class="${(t.pnl||0) >= 0 ? 'pnl-pos' : 'pnl-neg'}">${t.pnl ? fmt(t.pnl) : '—'}</td>
              <td style="color:var(--yellow)">${t.wu_actual ? t.wu_actual + '°' : '—'}</td>
              <td style="color:var(--muted);font-size:10px">${t.resolved_at ? t.resolved_at.split(' ').slice(0,2).join(' ') : '—'}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>`}
    </div>

    <!-- BY CITY -->
    <div class="section-title">🏙️ Performance by City</div>
    <div class="grid-3">
      ${d.by_city.map(c => {
        const wr = c.bets > 0 ? Math.round(c.wins/c.bets*100) : 0;
        return `<div class="card ${c.pnl >= 0 ? 'green' : 'red'}">
          <div class="card-label">${c.city}</div>
          <div class="card-value ${c.pnl >= 0 ? 'green' : 'red'}">${fmt(c.pnl)}</div>
          <div class="card-sub">${c.bets} bets · ${wr}% win · avg edge ${fmtPct(c.avg_edge)}</div>
        </div>`;
      }).join('')}
    </div>
  `;
}

loadData();
</script>
</body>
</html>
